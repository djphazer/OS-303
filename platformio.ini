; Build: PlatformIO (primary). Arduino IDE 1.8.x + Teensyduino also works:
;   Open src/src.ino, Tools → Board → Teensy++ 2.0, USB Type with Serial if needed, then Verify/Upload.
;   Export a .hex from Arduino (verbose build log path) or use Teensy Loader with a combined HEX from pio run.
;   SysEx for MIDI update: pio run -e app runs tools/makesyx.py → app-update.syx (same packing as tools/hex2sysex.py).
[platformio]
src_dir = src
default_envs =
  bootloader
  app303
  app606
  app808

[env]

[env:bootloader]
build_src_filter = +<bootloader/*>
platform = atmelavr
platform_packages = tool-avrdude
board_build.mcu = at90usb1286
board_build.f_cpu = 4000000L
upload_protocol = avrispmkii
; framework =
build_flags =
    -Os
    -Wl,--section-start=.text=0x1F000
    -nostartfiles
    -nostdlib
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

upload_flags = -p at90usb1286

; Flash bootloader via ISP
upload_command =
    avrdude -P usb -c avrispmkii -p at90usb1286
    -U flash:w:$SOURCE:i

[env:fuses]
platform = atmelavr
board_build.mcu = at90usb1286
upload_protocol = avrispmkii
upload_port = usb
upload_command =
    avrdude -c avrispmkii -p at90usb1286
    -U lfuse:w:0x9F:m
    -U hfuse:w:0xDA:m
    -U efuse:w:0xF8:m

[env:app303]
custom_project_version = OS-303-v0.8.2
framework = arduino
platform = teensy
board = teensy2pp
board_build.f_cpu = 4000000L
build_flags =
  -Wl,--section-start=.text=0x0000
build_src_filter = +<303/*>
platform_packages = tool-sreccat
extra_scripts =
  post:tools/makesyx.py
  post:tools/merge_firmware.py

; to merge both hex files
; srec_cat app.hex -Intel bootloader.hex -Intel -o firmware.hex -Intel
;extra_scripts = post:tools/merge_firmware.py

[env:app303-debug]
extends = env:app303
build_flags =
  -DUSB_SERIAL
  -DDEBUG=1
  -Wl,--section-start=.text=0x0000

[env:app606]
custom_project_version = OS-606-v0.1
framework = arduino
platform = teensy
board = teensy2pp
board_build.f_cpu = 4000000L
build_flags =
  -Wl,--section-start=.text=0x0000
build_src_filter = +<606/*>
platform_packages = tool-sreccat
extra_scripts =
  post:tools/makesyx.py
  post:tools/merge_firmware.py

[env:app808]
custom_project_version = OS-808-v0.2
framework = arduino
platform = teensy
board = teensy2pp
board_build.f_cpu = 4000000L
build_flags =
  -Wl,--section-start=.text=0x0000
build_src_filter = +<808/*>
platform_packages = tool-sreccat
extra_scripts =
  post:tools/makesyx.py
  post:tools/merge_firmware.py
